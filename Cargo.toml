[package]
name = "s76-fan-control"
version = "0.1.1"
edition = "2024"
description = "Fan control for System76 laptops with System76 Open Firmware, on Windows"
license = "MIT"
repository = "https://github.com/congluuit/NANOSystem76Fan"
readme = "README.md"
keywords = ["system76", "fan", "windows", "coreboot", "embedded-controller"]
categories = ["hardware-support"]

[lib]
name = "s76_fan_control"
path = "src/lib.rs"

[[bin]]
name = "S76FanControl"
path = "src/main.rs"
# The .exe embeds a requireAdministrator manifest; its (empty) test harness would need elevation.
test = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
libloading = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Threading", "Win32_System_Console", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $name = "S76FanControl-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/S76FanControl.exe, target/release/inpoutx64.dll, README.md, LICENSE $name
          Copy-Item vendor/inpout/LICENSE.txt "$name/LICENSE-InpOut.txt"
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            S76FanControl-*.zip
            S76FanControl-*.zip.sha256

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\S76FanControl.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $name = "S76FanControl-$version-portable"
          New-Item -ItemType Directory "dist/$name" -Force | Out-Null
          Copy-Item target/release/S76FanControl.exe, target/release/inpoutx64.dll, README.md "dist/$name"
          Copy-Item LICENSE "dist/$name/LICENSE.txt"
          Copy-Item vendor/inpout/LICENSE.txt "dist/$name/LICENSE-InpOut.txt"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
          # Hash first, write afterwards: piping straight into dist/ would hash the sums file itself.
          $sums = Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $sums | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-ChildItem dist

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
